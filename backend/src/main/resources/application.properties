spring.application.name=backend
server.port=8080
spring.config.import=optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_campus}
spring.datasource.username=postgres
spring.datasource.password=jobportal
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

spring.liquibase.enabled=false

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Match frontend upload expectations (PNG/JPG/PDF up to 10MB each)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB