databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: smart-campus-ops-hub
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: picture_url
                  type: varchar(500)
                  constraints:
                    nullable: true
              - column:
                  name: provider
                  type: varchar(20)
                  constraints:
                    nullable: false
                  defaultValue: LOCAL
              - column:
                  name: provider_id
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
                  defaultValue: USER
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
