databaseChangeLog:
  - changeSet:
      id: 002-create-tickets-table
      author: smart-campus-ops-hub
      changes:
        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
                  defaultValue: OPEN
              - column:
                  name: location
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: contact_phone
                  type: varchar(50)
                  constraints:
                    nullable: true
              - column:
                  name: contact_email
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: rejection_reason
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: resolution_notes
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: reporter_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ticket_reporter
                    references: users(id)
              - column:
                  name: assignee_id
                  type: uuid
                  constraints:
                    nullable: true
                    foreignKeyName: fk_ticket_assignee
                    references: users(id)
              - column:
                  name: sla_first_response_deadline
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: sla_resolution_deadline
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: first_response_at
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: resolved_at
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            indexName: idx_ticket_status
            tableName: tickets
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_ticket_reporter
            tableName: tickets
            columns:
              - column:
                  name: reporter_id
        - createIndex:
            indexName: idx_ticket_assignee
            tableName: tickets
            columns:
              - column:
                  name: assignee_id
